name: test

on:
  push:
  pull_request:

jobs:
  schedule:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse check
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\PeakWidget.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          "parse OK"

      - name: Schedule boundaries
        shell: powershell
        run: .\PeakWidget.ps1 -Test
